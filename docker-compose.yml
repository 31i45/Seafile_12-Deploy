# Seafile 极简部署配置
# 版本: 2026.03.22
# 遵循UNIX哲学：Just Enough

# 环境变量配置
x-seafile-env: &seafile-env
  DB_HOST: mariadb
  DB_ROOT_PASSWD: ${MYSQL_ROOT_PASSWORD}
  DB_NAME: seafile
  DB_USER: seafile
  DB_PASSWD: ${MYSQL_PASSWORD}
  SEAFILE_ADMIN_EMAIL: ${SEAFILE_ADMIN_EMAIL}
  SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD}
  SEAFILE_SERVER_HOSTNAME: ${SERVER_IP}:${HTTP_PORT}
  TZ: ${TZ}
  SEAFILE_SERVER_LETSENCRYPT: "false"
  SEAFILE_SERVER_PROTOCOL: "http"
  SEAFILE_TRUSTED_DOMAINS: ${SEAFILE_TRUSTED_DOMAINS}

# 目录挂载配置
volumes:
  seafile_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/seafile
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/mariadb
  caddy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/caddy
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/caddy/config
  caddy_log:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/caddy/log

# 网络配置
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16

# 服务配置
services:
  # 数据库服务
  mariadb:
    image: mariadb:11.4
    container_name: seafile-db
    restart: always
    volumes: [mariadb_data:/var/lib/mysql]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: seafile
      MYSQL_USER: seafile
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    command: >
      --transaction-isolation=READ-COMMITTED
      --binlog-format=ROW
      --innodb_buffer_pool_size=256M
      --innodb_log_file_size=64M
      --max_connections=100
      --skip-name-resolve
    networks: [default]
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Memcached 缓存服务
  memcached:
    image: memcached:1.6.39-alpine
    container_name: seafile-memcached
    restart: always
    command: memcached -m 256
    networks: [default]
    healthcheck:
      test: ["CMD", "echo", "flush_all", "|", "nc", "localhost", "11211"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Seafile 应用服务
  seafile:
    image: seafileltd/seafile-mc:latest
    #image: docker.seafile.top/seafileltd/seafile-mc:latest
    container_name: seafile-app
    restart: always
    volumes:
      - seafile_data:/shared
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 256M
    environment:
      <<: *seafile-env
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      mariadb: {condition: service_healthy}
      memcached: {condition: service_healthy}

  # Caddy 反向代理服务
  caddy:
    image: caddy:2.10.0-alpine
    container_name: seafile-proxy
    restart: always
    ports: ["${HTTP_PORT}:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_log:/var/log/caddy
    networks: [default]
    environment:
      - SERVER_IP=${SERVER_IP}
      - HTTP_PORT=${HTTP_PORT}
      - CADDY_ADMIN=0.0.0.0:2019
      - TZ=${TZ}
    command: sh -c "caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2019/config || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      seafile: {condition: service_healthy}
